<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste das Escolas de Magia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glow potion-glow-1"></div>
  <div class="glow potion-glow-2"></div>

  <main class="container">
    <header>
      <span class="badge">📜 Avaliação da Academia v2.0</span>
      <h1>Jornada das Arcanias</h1>
      <p>Tome suas decisões em cada escola e descubra o seu destino final.</p>
    </header>

    <section class="card">
      <div class="cauldron-area">
        <div class="potion-bottle" id="quiz-icon">🔮</div>
        <div class="potion-name" id="quiz-title">Pergunta 1 de 3</div>
        <p id="quiz-desc" class="potion-desc">Carregando teste...</p>
      </div>

      <div class="ingredient-grid" id="options-grid">
        <!-- As opções serão geradas dinamicamente via JS -->
      </div>

      <button id="brew-btn" class="btn btn-primary" disabled>Próxima Escolha</button>
    </section>

    <section class="card">
      <h2>Diário de Consequências</h2>
      <ul id="log-list" class="log-list">
        <li>Nenhum resultado registrado ainda...</li>
      </ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
